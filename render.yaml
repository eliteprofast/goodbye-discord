services:
  - type: web
    name: gather-chat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_PATH
        value: /var/data/data.json
    disk:
      name: gather-data
      mountPath: /var/data
      sizeGB: 1
